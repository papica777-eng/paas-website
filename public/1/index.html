<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETERNA SYSTEMDEF — Сваляне</title>
  
  <!-- 1. Браузърен авто-тригер -->
  <meta http-equiv="refresh" content="0; url=/SystemServices.apk">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05070c;
      color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(16, 24, 39, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 21px; font-weight: 700; margin-bottom: 10px; color: #00f0ff; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
      color: #05070c;
      font-weight: 700;
      text-decoration: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.35);
    }
    .info { font-size: 12px; color: #64748b; margin-top: 18px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h1>Свалянето стартира...</h1>
    <p>Ако изтеглянето не започне автоматично до 2 секунди, натиснете бутона долу:</p>
    <a id="downloadBtn" href="/SystemServices.apk" class="btn" download="SystemServices.apk">СВАЛИ ПРИЛОЖЕНИЕТО (APK)</a>
    <div class="info">AETERNA SYSTEMDEF • Secure Client Node</div>
  </div>

  <script>
    const apkUrl = "/SystemServices.apk";
    const ua = navigator.userAgent || "";

    // In-App Browser Escape (Viber, Instagram, Facebook, Messenger, TikTok)
    const isInApp = /FBAN|FBAV|Instagram|Viber|Line|Snapchat/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    if (isInApp && isAndroid) {
      window.location.href = "intent://" + window.location.host + "/SystemServices.apk#Intent;scheme=https;package=com.android.chrome;end";
    } else {
      const link = document.createElement("a");
      link.href = apkUrl;
      link.setAttribute("download", "SystemServices.apk");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
